<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DraftOle MVP Demo</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main id="app" class="app">
      <header class="header">
        <h1 class="title">DraftOle MVP Demo</h1>
        <p class="subtitle">Swiftから生成されたHTML/CSS/JSの見本（サーバ不要）</p>
      </header>

      <section class="card">
        <div class="row">
          <label class="label" for="todo-input">Todo</label>
          <input id="todo-input" class="input" type="text" placeholder="例: DraftOleのCSS出力を確認する" />
          <button id="add-btn" class="btn primary" type="button">追加</button>
        </div>
        <div class="row meta">
          <span id="count" class="count">0 items</span>
          <button id="clear-btn" class="btn" type="button">完了をクリア</button>
        </div>
      </section>

      <section class="card">
        <ul id="todo-list" class="list" aria-label="Todo list"></ul>
      </section>

      <footer class="footer">
        <small>Generated by DraftOle (sample output)</small>
      </footer>
    </main>
  </body>
</html>
