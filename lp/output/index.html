<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DraftOle — TypeScript DSL for Web</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body id="body">
        <div id="wrapper">
            <section id="hero">
                <h1 id="hero-title">HTML, CSS, JS — TypeScript ひとつで。</h1>
                <p id="hero-sub">型安全なDSLでWebページを丸ごと生成</p>
                <a href="#" id="hero-cta">Get Started</a>
            </section>
            <section id="features">
                <h2 id="features-title">なぜ DraftOle？</h2>
                <div id="features-row">
                    <div id="f1">
                        <h2 id="f1-title">三位一体</h2>
                        <p id="f1-desc">HTML・CSS・JSを1つのTypeScriptファイルで記述。もう3ファイルを行き来する必要はありません。</p>
                    </div>
                    <div id="f2">
                        <h2 id="f2-title">型安全</h2>
                        <p id="f2-desc">146以上のCSSプロパティすべてに型補完が効きます。タイポや無効な値をコンパイル時にキャッチ。</p>
                    </div>
                    <div id="f3">
                        <h2 id="f3-title">ゼロランタイム</h2>
                        <p id="f3-desc">出力は純粋なHTML/CSS/JS。ランタイム依存なし。どこにでもデプロイできます。</p>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
